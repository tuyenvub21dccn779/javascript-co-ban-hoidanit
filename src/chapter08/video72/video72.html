  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      #todoList {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }

      #todoList td,
      #todoList th {
        border: 1px solid #ddd;
        padding: 8px;
      }

      #todoList tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      #todoList tr:hover {
        background-color: #ddd;
      }

      #todoList th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #04aa6d;
        color: white;
      }
    </style>
  </head>

  <body>
    <h1>Video 72</h1>
    <h2>Todo List:</h2>
    <div>
      <form>
        <div>
          <label>Title: </label>
          <input id="title" type="text" />
        </div>
        <br />
        <div>
          <label>Author: </label>
          <input id="author" type="text" />
        </div>
        <br />
        <div>
          <label>Content: </label>
          <input id="content" type="text" />
        </div>
        <br />
        <div>
          <input id="submitBtn" type="submit" value="Save" />
        </div>
      </form>
    </div>
    <table id="todoList">
      <thead>
        <th>Id</th>
        <th>Title</th>
        <th>Author</th>
        <th>Content</th>
        <th>Action</th>
      </thead>
